name: Spec Contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      SOUSTACK_SPEC_SOURCE: npm

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install soustack spec package
        run: npm install --no-save "soustack-spec@$(node -p \"require('./package.json').soustackSpecVersion\")"

      - name: Sync soustack spec
        run: npm run sync:spec

      - name: Ensure spec artifacts are committed
        run: |
          git diff --exit-code

      - name: Run tests
        run: npm test
