name: Spec Contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare soustack spec package
        run: |
          SPEC_VERSION=$(node -p "require('./package.json').devDependencies['soustack-spec']")
          rm -rf node_modules/soustack-spec
          mkdir -p node_modules/soustack-spec
          cp -R spec/. node_modules/soustack-spec
          cat > node_modules/soustack-spec/package.json <<EOF
          {
            "name": "soustack-spec",
            "version": "${SPEC_VERSION}"
          }
          EOF

      - name: Sync soustack spec
        run: npm run sync:spec
        env:
          SOUSTACK_SPEC_SOURCE: npm

      - name: Ensure spec artifacts are committed
        run: |
          # Exclude spec/.sync-meta.json from diff check since source-related fields
          # (sourceRepo, commit, source) may differ between git and npm syncs,
          # but the actual spec content is verified to be the same
          CHANGED_FILES=$(git diff --name-only | grep -v '^spec/\.sync-meta\.json$' || true)
          if [ -n "$CHANGED_FILES" ]; then
            echo "Error: Spec artifacts have uncommitted changes:"
            echo "$CHANGED_FILES"
            exit 1
          fi

      - name: Run tests
        run: npm test
