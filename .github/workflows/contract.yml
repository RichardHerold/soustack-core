name: Spec Contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      SOUSTACK_SPEC_SOURCE: npm

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare soustack spec package
        run: |
          SPEC_VERSION=$(node -p "require('./package.json').devDependencies['soustack-spec']")
          rm -rf node_modules/soustack-spec
          mkdir -p node_modules/soustack-spec
          cp -R spec/. node_modules/soustack-spec
          cat > node_modules/soustack-spec/package.json <<EOF
          {
            "name": "soustack-spec",
            "version": "${SPEC_VERSION}"
          }
          EOF

      - name: Sync soustack spec
        run: npm run sync:spec

      - name: Ensure spec artifacts are committed
        run: |
          git diff --exit-code

      - name: Run tests
        run: npm test
