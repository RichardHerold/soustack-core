name: Spec Contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync soustack spec
        run: npm run sync:spec

      - name: Ensure spec artifacts are committed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Spec artifacts out of date. Run npm run sync:spec and commit changes."
            git status --porcelain
            exit 1
          fi

      - name: Run tests
        run: npm test
